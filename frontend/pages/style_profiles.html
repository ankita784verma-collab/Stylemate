<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Analytics - StyleMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">StyleMate</a>
            <div>
                <a href="dashboard.html" class="btn btn-outline-dark me-2">Dashboard</a>
                <button class="btn btn-dark" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="fw-bold mb-5">Style Analytics</h1>

        <!-- Stats Grid -->
        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="card p-4 text-center">
                    <h5 class="text-muted mb-2">Total Items</h5>
                    <h2 class="fw-bold" id="totalItems">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4 text-center">
                    <h5 class="text-muted mb-2">Categories</h5>
                    <h2 class="fw-bold" id="totalCategories">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4 text-center">
                    <h5 class="text-muted mb-2">Top Color</h5>
                    <h2 class="fw-bold" id="topColor">N/A</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4 text-center">
                    <h5 class="text-muted mb-2">Main Style</h5>
                    <h2 class="fw-bold" id="mainStyle">N/A</h2>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">Wardrobe by Category</h5>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">Color Distribution</h5>
                    <canvas id="colorChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
