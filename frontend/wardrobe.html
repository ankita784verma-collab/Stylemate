<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wardrobe - StyleMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">StyleMate</a>
        <div>
            <a href="dashboard.html" class="btn btn-outline-dark me-2">Dashboard</a>
            <a href="login.html" class="btn btn-dark">Logout</a>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="fw-bold">My Wardrobe</h1>
            <p class="text-muted mb-0">Everything you own, organized in one place.</p>
        </div>
        <a href="add_clothing.html" class="btn btn-dark">+ Add Clothing</a>
    </div>

    <!-- DYNAMIC WARDROBE GRID -->
    <div class="row g-4" id="wardrobe-container">
        <!-- Item Template -->
        <div class="col-12 col-md-6 col-lg-4 d-none" id="wardrobe-item-template">
            <div class="wardrobe-card">
                <div class="wardrobe-image">
                    <img src="" alt="" class="img-fluid item-image">
                </div>
                <div class="p-4">
                    <span class="badge bg-light text-dark mb-2 item-category"></span>
                    <h5 class="fw-bold item-title"></h5>
                    <p class="text-muted small mb-0">
                        Color: <span class="item-color"></span> | Season: <span class="item-season"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
